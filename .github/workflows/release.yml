name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content techchase-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match the app version $version in techchase-app/tauri.conf.json" }

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p techchase-app

      - name: The exe stands alone
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\techchase.exe
          $deps
          if ($deps -match 'WebView2Loader|VCRUNTIME|MSVCP|libgcc|libwinpthread|libstdc') { throw 'techchase.exe needs a DLL that does not come with Windows' }

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\techchase.exe dist\techchase.exe
          $hash = (Get-FileHash dist\techchase.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  techchase.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: techchase-windows
          path: rust/dist/

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/techchase.exe dist/SHA256SUMS.txt --draft --generate-notes --title "techchase ${{ github.ref_name }}"
