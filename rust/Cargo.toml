[workspace]
resolver = "3"
members = ["techchase-core", "techchase-usb", "techchase-cli"]

[workspace.package]
edition = "2024"
license = "CC-BY-NC-SA-3.0"
publish = false

[workspace.lints.rust]
# The code carries no comments (CONTRIBUTING.md), so public items have no doc comments to require.
missing_docs = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
# No panics outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
exit = "warn"
# Style and safety.
as_conversions = "warn"
wildcard_enum_match_arm = "warn"
clone_on_ref_ptr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# The same rules have no doc sections to ask for.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
