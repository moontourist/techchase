[workspace]
resolver = "3"
members = ["techchase-core", "techchase-cli"]

[workspace.package]
edition = "2024"
license = "CC-BY-NC-SA-3.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
pedantic = { level = "warn", priority = -1 }
# The code carries no comments (CONTRIBUTING.md), so no doc sections either
missing_errors_doc = "allow"
missing_panics_doc = "allow"
